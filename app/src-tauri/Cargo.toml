[package]
name = "zzabbaxterm"
version = "0.1.0"
description = "ZzabbaXterm"
edition = "2024"
default-run = "zzabbaxterm"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "zzabbaxterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
getrandom = "0.4"
tauri = { version = "2", features = [] }
portable-pty = "0.9"
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aws-smithy-async = "1"
aws-credential-types = "1"
aws-sdk-s3 = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sso = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sts = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-smithy-checksums = "0.65"
aws-smithy-http-client = { version = "1", features = ["rustls-aws-lc"] }
aws-smithy-runtime = "1"
aws-smithy-runtime-api = { version = "1", features = ["client"] }
aws-smithy-types = "1"
http = "1"
percent-encoding = "2"
sha2 = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["std"] }
sha1 = "0.10"
shlex = "2"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-util = "0.7"
zeroize = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
aws-config = { version = "1", default-features = false, features = ["test-util"] }
aws-runtime = "1"
aws-smithy-http-client = { version = "1", features = ["test-util"] }
aws-types = "1"
http-body = "1"
tauri = { version = "2", features = ["test"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_UI_Shell"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
