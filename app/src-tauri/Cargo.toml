[package]
name = "zzabbaxterm"
version = "0.1.0"
description = "ZzabbaXterm"
edition = "2024"
default-run = "zzabbaxterm"

[features]
default = ["local-cli"]
local-cli = []
ai-control = []

# 배포 빌드에서는 Cargo 타깃 대신 준비된 sidecar를 넣는다.
[[bin]]
name = "zzabba"
path = "src/bin/zzabba.rs"
required-features = ["local-cli"]

# Linux 노드에 별도로 배포한다.
[[bin]]
name = "zzabba-ai-control"
path = "src/bin/zzabba-ai-control.rs"
required-features = ["ai-control"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "zzabbaxterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
tauri-utils = "2"
json-patch = "4"
serde_json = "1"

[dependencies]
base64 = "0.23"
dirs = "7"
getrandom = "0.4"
tauri = { version = "2", features = [] }
portable-pty = "0.9"
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }
russh-sftp = { version = "4.0", features = ["raw-string"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aws-smithy-async = "1"
aws-credential-types = "1"
aws-sdk-s3 = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sso = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sts = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-smithy-checksums = "0.65"
aws-smithy-http-client = { version = "1", features = ["rustls-aws-lc"] }
aws-smithy-runtime = "1"
aws-smithy-runtime-api = { version = "1", features = ["client"] }
aws-smithy-types = "1"
http = "1"
percent-encoding = "2"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["std"] }
sha1 = "0.10"
sha2 = "0.10"
ssh-key = { version = "0.6.7", default-features = false, features = ["alloc", "ecdsa"] }
shlex = "2"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
zeroize = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
aws-config = { version = "1", default-features = false, features = ["test-util"] }
aws-runtime = "1"
aws-smithy-http-client = { version = "1", features = ["test-util"] }
aws-types = "1"
bytes = "1"
http-body = "1"
tauri = { version = "2", features = ["test"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Console", "Win32_System_Diagnostics_Debug", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_WindowsProgramming", "Win32_UI_Controls_Dialogs", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
